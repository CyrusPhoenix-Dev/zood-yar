<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <!-- ===========================
       VIEWPORT / RESPONSIVE
  =========================== -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===========================
       PRIMARY SEO META
       Replace the content values — these are the ones Google
       actually uses for search snippets and ranking signals.
  =========================== -->
  <title>زودیار | پلتفرم رزرو آنلاین مشاوره و خدمات</title>
  <meta name="title" content="زودیار | پلتفرم رزرو آنلاین مشاوره و خدمات" />
  <meta name="description" content="زودیار، بازار آنلاین دو طرفه برای رزرو خدمات مشاوره و خدمات حضوری. اتصال مستقیم به متخصصان معتبر، رزرو ساده و سریع." />
  <meta name="keywords" content="رزرو مشاوره, مشاوره آنلاین, خدمات حضوری, زودیار" />
  <meta name="author" content="Zood-yar" />
  <link rel="canonical" href="https://zood-yar.ir/" />

  <!-- ===========================
       ROBOTS / INDEXING
       Controls whether search engines crawl & index this page.
  =========================== -->
  <meta name="robots" content="index, follow" />

  <!-- ===========================
       FAVICON / APP ICONS
       Add these files to your /public folder — paths assume Vite's
       default static asset serving from root.
  =========================== -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- ===========================
       THEME COLOR
       Controls browser UI color on mobile (address bar on Android/iOS).
       Matches your --primary variable.
  =========================== -->
  <meta name="theme-color" content="#3A6EA5" />

  <!-- ===========================
       OPEN GRAPH (Facebook, LinkedIn, WhatsApp, Telegram previews)
       og:image should be 1200x630px, hosted at an absolute URL.
  =========================== -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://zood-yar.ir/" />
  <meta property="og:title" content="زودیار | پلتفرم رزرو آنلاین مشاوره و خدمات" />
  <meta property="og:description" content="بازار آنلاین دو طرفه برای رزرو خدمات مشاوره و خدمات حضوری. اتصال مستقیم به متخصصان معتبر." />
  <meta property="og:image" content="https://zood-yar.ir/og-image.jpg" />
  <meta property="og:locale" content="fa_IR" />
  <meta property="og:site_name" content="Zood-yar" />

  <!-- ===========================
       TWITTER / X CARD
       Falls back to Open Graph tags above if omitted, but explicit
       is safer — some previews still read this separately.
  =========================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://zood-yar.ir/" />
  <meta name="twitter:title" content="زودیار | پلتفرم رزرو آنلاین مشاوره و خدمات" />
  <meta name="twitter:description" content="بازار آنلاین دو طرفه برای رزرو خدمات مشاوره و خدمات حضوری." />
  <meta name="twitter:image" content="https://zood-yar.ir/og-image.jpg" />

  <!-- ===========================
       FONTS
       Preconnect first to shave DNS/TLS time, then load.
  =========================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ===========================
       STRUCTURED DATA (JSON-LD)
       Helps Google understand this is a business/service, can enable
       rich results (star ratings, business info in search results).
       Fill in real values once you have them — sameAs links to your
       social profiles help build trust signals too.
  =========================== -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "زودیار",
    "alternateName": "Zood-yar",
    "url": "https://zood-yar.ir",
    "description": "بازار آنلاین دو طرفه برای رزرو خدمات مشاوره و خدمات حضوری",
    "sameAs": []
  }
  </script>

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
